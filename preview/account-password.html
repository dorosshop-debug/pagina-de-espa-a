<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doroshopping - Crear contraseña (preview)</title>
    <link rel="icon" href="../theme/Doro_theme_oficial/assets/images/icon.png">
    <link rel="stylesheet" href="../theme/Doro_theme_oficial/assets/css/main.css">
</head>
<body class="woocommerce woocommerce-account doro-password-view">

<div data-include="partials/header-compact.html"></div>

<main id="main-content" class="doro-page">
    <div class="doro-page__container">
        <article class="doro-page__article">
            <header class="doro-page__header">
                <h1 class="doro-page__title">Mi cuenta</h1>
            </header>
            <div class="doro-page__content entry-content">
                <div class="woocommerce">
                    <div class="doro-password-page doro-password-page--reset">
                        <div class="doro-password-page__card">
                            <div class="doro-password-page__brand">
                                <img src="../theme/Doro_theme_oficial/assets/images/logo/logo_header.png" alt="Doroshopping">
                            </div>
                            <p class="doro-password-page__eyebrow">Seguridad de la cuenta</p>
                            <h1 class="doro-password-page__title">Crea tu contraseña</h1>
                            <p class="doro-password-page__lead">Tu cuenta está casi lista. Elige una contraseña segura para acceder a tus pedidos y favoritos.</p>
                            <form class="doro-password-page__form" action="#" method="post">
                                <p class="form-row">
                                    <label for="password_1">Nueva contraseña *</label>
                                    <input class="input-text" type="password" id="password_1" name="password_1" autocomplete="new-password">
                                </p>
                                <p class="form-row">
                                    <label for="password_2">Confirmar contraseña *</label>
                                    <input class="input-text" type="password" id="password_2" name="password_2" autocomplete="new-password">
                                </p>
                                <p class="form-row">
                                    <button type="submit" class="doro-password-page__submit">Guardar contraseña</button>
                                </p>
                            </form>
                            <p class="doro-password-page__footer"><a href="account.html">Ir a iniciar sesión</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </article>
    </div>
</main>

<div data-include="partials/footer.html"></div>
<script src="partials/load-partials.js"></script>
<script src="preview-session.js"></script>
<script src="../theme/Doro_theme_oficial/assets/js/main.js"></script>
</body>
</html>
